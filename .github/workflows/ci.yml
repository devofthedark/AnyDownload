# Builds every target on each PR (including Dependabot's) and push to main, so a dependency bump that
# breaks vendoring or packaging fails here. It doesn't test downloads.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      # postinstall runs scripts/vendor.mjs, which builds libs/ and downloads the wheels from PyPI
      - run: npm ci

      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: dist/*.zip
          retention-days: 7
