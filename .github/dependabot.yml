# Opens a PR when a pinned dependency has a new release. libs/ is generated by `npm install` (see
# scripts/vendor.mjs), so the pin and the lockfile are all a bump needs to change. Each PR is built by
# .github/workflows/ci.yml, but still load the extension and try a download before merging.
version: 2
updates:
  # package.json: Mediabunny and Pyodide
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # scripts/vendor.mjs requires all Mediabunny packages to share one version
      mediabunny:
        patterns:
          - mediabunny
          - "@mediabunny/*"
    commit-message:
      prefix: deps

  # requirements.txt: the wheels loaded into Pyodide. yt-dlp-ejs isn't listed there; its version
  # follows yt-dlp's own pin.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  # the actions used by .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
